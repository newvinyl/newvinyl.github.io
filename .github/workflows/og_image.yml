name: Link preview image

# After each daily update: preview image for shared links with the newest covers (og/new-<date>.jpg).
on:
  push:
    branches: [main]
    paths: [releases.json, tools/og_image.py, .github/workflows/og_image.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: og-image
  cancel-in-progress: false

jobs:
  og:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-texgyre fonts-dejavu-core ffmpeg >/dev/null
          pip install -q numpy pillow "opencv-python-headless<5"
      - name: Render
        run: python3 tools/og_image.py
      - name: Commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add og index.html all/index.html
          git diff --cached --quiet && exit 0
          git commit -qm "Link preview image $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
