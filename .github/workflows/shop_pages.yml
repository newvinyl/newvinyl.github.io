name: Shop pages

# Fetches the shops' new-release pages every morning before the daily update and stores them
# as compact text on branch "shop-pages" (pages/*.txt). The scheduled Claude task reads them there.
on:
  # GitHub often starts scheduled runs hours late (31.10./01.11. only around noon) or skips
  # them, so there are two slots, and the daily task starts a run itself if the pages are not
  # from today (workflow_dispatch, or a push of tools/shop_pages_request.txt).
  schedule:
    - cron: "20 3 * * *"   # 04:20 Zurich (winter) / 05:20 (summer)
    - cron: "10 4 * * *"   # 05:10 Zurich (winter) / 06:10 (summer); the daily task starts at 06:38 Zurich
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/fetch_pages.py, tools/shop_feeds.py, tools/shop_pages_request.txt, .github/workflows/shop_pages.yml]

permissions:
  contents: write

concurrency:
  group: shop-pages
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: python3 tools/fetch_pages.py "$RUNNER_TEMP/sp"
      - name: Publish to branch shop-pages
        run: |
          cd "$RUNNER_TEMP/sp" && git init -q && git checkout -q -b shop-pages
          git add pages && git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -qm "Shop pages $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shop-pages
