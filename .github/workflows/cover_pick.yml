name: Cover pick
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/cover_pick.py]
permissions:
  contents: write
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy -q
      - run: |
          python3 tools/cover_pick.py 2>/tmp/pick.log || true
          mkdir -p /tmp/lg && cp -r pick /tmp/lg/ 2>/dev/null; cp /tmp/pick.log /tmp/lg/; cd /tmp/lg && git init -q && git checkout -q -b cover-pick && git add .
          git -c user.name=bot -c user.email=bot@x commit -qm pick
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cover-pick
