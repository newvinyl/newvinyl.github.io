name: Preview check

# Läuft nach jedem täglichen Update (Push von releases.json) und am Mittag:
# holt fehlende Hörproben direkt von den Shop-Produktseiten, prüft jeden Clip,
# schreibt releases.json zurück und baut die statischen Seiten neu.
on:
  push:
    branches: [main]
    paths: [releases.json]
  schedule:
    - cron: "17 10 * * *"   # 12:17 Zurich (Sommerzeit)
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur eine Seite untersuchen (URL)"
        required: false
      needle:
        description: "Text, um den herum ausgegeben wird (|| trennt mehrere)"
        required: false

permissions:
  contents: write

concurrency:
  group: previews
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Probe
        if: ${{ github.event.inputs.probe != '' }}
        run: |
          python3 tools/previews.py --probe "${{ github.event.inputs.probe }}" "${{ github.event.inputs.needle }}" > tools/probe.txt 2>&1 || true
          git add tools/probe.txt && git commit -q -m "Preview probe" && for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Check previews and rebuild
        if: ${{ github.event.inputs.probe == '' }}
        run: |
          python3 tools/previews.py 2>&1 | tee tools/preview_run.txt
          python3 tools/build_static.py
      - name: Commit
        if: ${{ github.event.inputs.probe == '' }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Preview check $(date -u +%F): $(head -1 tools/preview_run.txt | cut -c1-120)"
          for i in 1 2 3; do
            if git pull --rebase -q origin main; then git push -q origin HEAD:main && exit 0; fi
            # Konflikt (tägliches Update kam dazwischen): neu aufsetzen und nochmals laufen
            git rebase --abort || true
            git reset -q --hard origin/main
            python3 tools/previews.py > /dev/null && python3 tools/build_static.py > /dev/null
            git add -A && git commit -q -m "Preview check $(date -u +%F) (retry)" || exit 0
            sleep 5
          done
          exit 1
