name: Probe shops
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/probe_shops.py, tools/probe_shops.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/probe_shops.py tools/probe_shops.txt > /tmp/probe.json 2>/tmp/probe.log || true
          mkdir -p /tmp/lg && cd /tmp/lg && git init -q && git checkout -q -b probe-shops && cp /tmp/probe.json /tmp/probe.log . && git add .
          git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-shops
