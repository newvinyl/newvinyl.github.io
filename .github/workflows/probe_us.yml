name: Probe US shops
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/probe_us.py, tools/probe_us.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/probe_us.py tools/probe_us.txt 2>/tmp/probe.log || true
          mkdir -p /tmp/lg && cp -r probe /tmp/lg/ 2>/dev/null; cp /tmp/probe.log /tmp/lg/; cd /tmp/lg && git init -q && git checkout -q -b probe-us && git add .
          git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-us
