name: Genre carousel

# Instagram carousel: title image + short video slides with the real previews. Genre/days in tools/genre_carousel.json.
# Daily: runs after every finished «Today's Digs» run (so it knows today's three digs records and skips them).
on:
  workflow_run:
    workflows: ["Today's Digs"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/genre_carousel.json, tools/genre_carousel.py, .github/workflows/genre_carousel.yml]

permissions:
  contents: write

concurrency:
  group: genre-carousel
  cancel-in-progress: true

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-texgyre fonts-dejavu-core >/dev/null
          pip install -q numpy pillow opencv-python-headless
      - name: Render
        env:
          REEL_WORK: ${{ runner.temp }}/c
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$REEL_WORK"
          # after a Today's Digs run: render only if today's carousel is missing or the digs records changed
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            gh release download carousel -p carousel.json -D /tmp/prev 2>/dev/null || true
            if python3 - <<'PY'
          import json, sys
          try:
              prev = json.load(open("/tmp/prev/carousel.json"))
          except Exception:
              sys.exit(1)
          day = json.load(open("releases.json"))["updated"]
          hist = json.load(open("92h6fy/history.json"))
          keys = sorted(next((e.get("keys", []) for e in hist if e.get("date") == day), []))
          sys.exit(0 if prev.get("date") == day and prev.get("digs_keys") == keys else 1)
          PY
            then echo '{"skip": true, "genre": "already-done"}' > "$REEL_WORK/result.json"; echo "carousel already done"; exit 0; fi
          fi
          python3 tools/genre_carousel.py > "$REEL_WORK/result.json" 2> "$REEL_WORK/log.txt" || { cat "$REEL_WORK/log.txt"; exit 1; }
          cat "$REEL_WORK/result.json"
      - name: Save log
        if: always()
        env:
          REEL_WORK: ${{ runner.temp }}/c
        run: |
          mkdir -p /tmp/lg && cd /tmp/lg && git init -q && git checkout -q -b carousel-log
          { cat "$REEL_WORK/result.json" 2>/dev/null; tail -c 40000 "$REEL_WORK/log.txt" 2>/dev/null; } > log.txt || echo "no log" > log.txt
          git add log.txt && git -c user.name=bot -c user.email=bot@x commit -qm log
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" carousel-log
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REEL_WORK: ${{ runner.temp }}/c
        run: |
          set +e
          cd "$REEL_WORK"
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('result.json')).get('skip') else 1)"; then echo "skip"; exit 0; fi
          {
          set -x
          ls -la
          G=$(python3 -c "import json;print(json.load(open('result.json'))['genre'].lower().replace(' ','-'))")
          zip -q -j "carousel-$G.zip" slide-*.mp4 slide-*.jpg caption.txt carousel.json
          gh release view carousel >/dev/null 2>&1 || gh release create carousel --prerelease --title "Genre carousel" --notes "Instagram carousels: title image + video slides." --target main
          gh release upload carousel --clobber "carousel-$G.zip" slide-*.mp4 slide-*.jpg caption.txt carousel.json
          } > up.txt 2>&1; rc=$?
          cd /tmp/lg && cp "$REEL_WORK/up.txt" . && git add up.txt && git -c user.name=bot -c user.email=bot@x commit -qm up
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" carousel-log
          exit $rc
