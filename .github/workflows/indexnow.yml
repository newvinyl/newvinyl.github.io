name: IndexNow
# Meldet neue Seiten an Bing/DuckDuckGo & Co., sobald eine neue sitemap.xml gepusht wird.
on:
  push:
    branches: [main]
    paths: [sitemap.xml]
  # Grosse Pushes (tägliches Update mit tausenden Dateien) starten Workflows oft nicht, daher zusätzlich nach Zeitplan.
  schedule:
    - cron: "20 9 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Alle URLs aus sitemap.xml melden"
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Warten, bis GitHub Pages die neue Version ausliefert
        run: sleep 120
      - name: IndexNow
        run: python3 tools/indexnow.py ${{ inputs.all && '--all' || '' }}
