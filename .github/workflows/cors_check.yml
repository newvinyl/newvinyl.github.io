name: CORS check
on:
  push:
    branches: [main]
    paths: [.github/workflows/cors_check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > /tmp/out.txt
          import json,urllib.request
          d=json.load(open('releases.json'))
          for s in d['shops']:
            its=[i for i in (s.get('items') or []) if i.get('cover')][-1:]
            for i in its:
              u=i['cover']
              try:
                r=urllib.request.urlopen(urllib.request.Request(u,headers={"Origin":"https://monthlyvinyl.net","User-Agent":"Mozilla/5.0"}),timeout=30)
                print(s['shop'],r.status,r.headers.get('Access-Control-Allow-Origin'),u)
              except Exception as e: print(s['shop'],'ERR',e,u)
          PY
          mkdir -p /tmp/lg && cd /tmp/lg && git init -q && git checkout -q -b cors-log && cp /tmp/out.txt log.txt && git add log.txt && git -c user.name=bot -c user.email=bot@x commit -qm log && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cors-log
