  const m=document.getElementById("tlm");if(m){const below=[...tl.children].filter(li=>li.offsetTop>=tl.scrollTop+tl.clientHeight-4).length;m.textContent=below?`↓ ${below} more`:""}}
let pt=null;
function go(i){
  i=Math.max(0,Math.min(L.length,i));if(i===cur)return;cur=i;ti=0;render();flips++;
  if(flips===5)track("Beta flip",{crate:crate.name,n:5});
  clearTimeout(pt);if(listening)playTrack(0);else warm();   // sofort spielen (User 27.11.: keine Wartezeit beim Blättern)
}
// Vorladen: erste Hörprobe der nächsten zwei Platten, der vorherigen und den nächsten Track der aktuellen.
// Der Browser legt sie in den Cache, beim Weiterblättern startet der Ton dann ohne Ladezeit.
const WARM=new Map();
function warm(){
  const want=[];const add=u=>{if(u&&!want.includes(u))want.push(u)};
  const r=L[cur];if(r&&r.tracks.length>1)add(r.tracks[(ti+1)%r.tracks.length].u);
  [cur+1,cur+2,cur-1].forEach(k=>{const x=L[k];if(x&&x.tracks[0])add(x.tracks[0].u)});
  for(const [u,a] of WARM)if(!want.includes(u)){a.removeAttribute("src");a.load();WARM.delete(u)}
  want.forEach(u=>{if(WARM.has(u)||u===au.src)return;const a=new Audio();a.preload="auto";a.muted=true;a.src=u;try{a.load()}catch(e){}WARM.set(u,a)});
}
function playTrack(j){
  clearTimeout(pt);const r=L[cur];if(!r||!r.tracks[j])return;
  ti=j;listening=true;stage.classList.remove("idle");document.querySelector(".sp").classList.remove("nudge");hintKeys();
  au.muted=false;au.src=r.tracks[j].u;au.play().catch(e=>{if(e&&e.name==="NotAllowedError"){listening=false;hintKeys()}});paintInfo();warm();
}
// ← (User 28.11.): vorheriger Track; beim ersten Track von vorne
function prevTrack(){const r=L[cur];if(!r)return;if(!listening){playTrack(0);return}if(ti>0){playTrack(ti-1);hop()}else{au.currentTime=0;au.play().catch(()=>{})}}
function nextTrack(){const r=L[cur];if(!r)return;if(!listening){playTrack(0);return}playTrack((ti+1)%r.tracks.length);hop()}
// Trackwechsel sichtbar machen: die Platte hüpft kurz in der Kiste
function hop(){const e=EL.get(cur);if(!e)return;const c=TOUCH?"tick":"hop";e.classList.remove(c);void e.offsetWidth;e.classList.add(c);setTimeout(()=>e.classList.remove(c),600)}
function toggle(){if(!listening||!au.src){playTrack(ti);track("Beta play",{crate:crate.name});return}if(au.paused)au.play().catch(()=>{});else au.pause()}
// In den Bag: die Platte fliegt zum Bag-Symbol oben rechts, dann kommt die nächste nach vorne
function pack(){
  const r=L[cur],e=EL.get(cur);if(!r||!e||busy)return;
  // Ausverkauft: nicht in den Bag, Platte schüttelt kurz den Kopf
  if(r.out&&!cart.includes(r.key)){e.classList.remove("nope");void e.offsetWidth;e.classList.add("nope");const so=document.getElementById("sob");if(so){so.classList.add("hit");setTimeout(()=>so.classList.remove("hit"),700)}return}
  busy=true;
  cart=store.get("mvr-cart",[]);if(!cart.includes(r.key)){cart.push(r.key);store.set("mvr-cart",cart);track("Add to bag",{shop:r.main.S.shop,where:"beta"})}
  const t=document.getElementById("bagtop"),a=t.getBoundingClientRect(),b=e.getBoundingClientRect();
  const cur0=getComputedStyle(e).transform;e.classList.remove("snap");e.classList.add("pack");e.style.transform=`translate(${a.left+a.width/2-(b.left+b.width/2)}px,${a.top+a.height/2-(b.top+b.height/2)}px) ${cur0==='none'?'':cur0} rotate(-14deg) scale(.07)`;e.style.opacity=0;
  setTimeout(()=>{bagCount();t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");e.remove();EL.delete(cur);busy=false;go(cur+1)},600)}
// Eine Stelle für alle Eingaben (Tastatur, Klick auf Tasten, Swipe); die erste Eingabe startet auch den Ton
function act(a,arg){
  if(busy)return;
  const first=!listening&&L[cur];
  if(TOUCH){if(tut===1&&(a==="next"||a==="prev"))tutGo(2);else if(tut===2&&a==="track")tutGo(3);else if(tut===3&&a==="bag"&&L[cur]&&!(L[cur].out&&!cart.includes(L[cur].key)))tutGo(4)}
  usedK.add(a);if(a==="next"||a==="prev")used.up=true;if(a==="track")used.rt=true;if(a==="bag")used.bag=true;if(TOUCH)store.set("mvr-betahints2",{up:used.up,rt:used.rt,bag:used.bag});
  if(used.both&&(a==="next"||a==="prev"||a==="track"))used.up=used.rt=true;
  if(a==="next"){go(arg!=null?arg:cur+1)}
  else if(a==="prev"){go(cur-1)}
  else if(a==="bag"){pack()}
  else if(a==="track"){nextTrack()}
  else if(a==="back"){prevTrack()}
  else if(a==="play"){toggle()}
  if(first&&!listening&&a!=="play"&&a!=="bag"){listening=true;clearTimeout(pt);playTrack(0);track("Beta play",{crate:crate.name,via:a})}
  hintKeys();
}
// Esc: zurück zum klassischen Feed
addEventListener("keydown",e=>{if(e.key==="Escape"&&!e.metaKey&&!e.ctrlKey){location.href="/"}});
const KEYMAP={ArrowUp:"next",ArrowDown:"prev",ArrowLeft:"back",ArrowRight:"track"," ":"play",Enter:"bag"};
function flash(k){const b=document.querySelector(`.key[data-k="${k===" "?" ":k}"]`);if(!b)return;b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),140)}
document.querySelectorAll(".key").forEach(b=>b.onclick=()=>{act(KEYMAP[b.dataset.k]);stage.focus({preventScroll:true})});
au.addEventListener("play",()=>{stage.classList.add("playing");const n=document.getElementById("nowl");if(n)n.textContent="Now playing"});
au.addEventListener("pause",()=>{stage.classList.remove("playing");const n=document.getElementById("nowl");if(n)n.textContent="In front"});
au.addEventListener("timeupdate",()=>{const i=document.querySelector(".tl li.on .pg i");if(i&&au.duration)i.style.width=(au.currentTime/au.duration*100)+"%"});
// Ende der Hörprobe: nächster Track, nach dem letzten die nächste Platte (Kiste läuft von selbst weiter)
au.addEventListener("ended",()=>{const r=L[cur];if(r&&ti+1<r.tracks.length)playTrack(ti+1);else go(cur+1)});

let kh=null;
document.addEventListener("keyup",e=>{if(!kh||e.key!==kh.k)return;const h=kh;kh=null;clearTimeout(h.t);clearInterval(h.iv);
  if(h.seek){au.playbackRate=1;const b=document.querySelector(`.key[data-k="${h.k}"]`);if(b)b.classList.remove("held")}else act(KEYMAP[h.k])});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/input|textarea/i.test(e.target.tagName))return;
  const k=e.key;
  // ← / → lange halten = zurück- bzw. vorspulen, kurz drücken = Trackwechsel (User 28.11.)
  if(k==="ArrowLeft"||k==="ArrowRight"){e.preventDefault();if(e.repeat||kh)return;flash(k);
    kh={k,t:setTimeout(()=>{kh.seek=true;if(!listening)act("play");if(k==="ArrowRight"){au.preservesPitch=false;au.webkitPreservesPitch=false;au.playbackRate=3}else kh.iv=setInterval(()=>{au.currentTime=Math.max(0,au.currentTime-.5)},100);
      document.querySelector(`.key[data-k="${k}"]`).classList.add("held")},380)};return}
  if(KEYMAP[k]){if((k===" "||k==="Enter")&&(e.target.tagName==="A"||(e.target.tagName==="BUTTON"&&!e.target.classList.contains("key"))))return;flash(k);act(KEYMAP[k])}
  else if(k==="o"){const r=L[cur];if(r){track("Shop click",{shop:r.main.S.shop,where:"beta"});window.open(r.main.url,"_blank","noopener")}}
  else if(k==="b"||k==="B"){flash("Enter");act("bag")}
  else return;
  e.preventDefault();
});
// Nach Mausklick auf Filter/Buttons den Fokus lösen, sonst löst Space den Button erneut aus statt Play/Pause (User 28.11.)
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button,a");if(b&&e.detail>0)b.blur()});
// Mausrad / Trackpad senkrecht: nächste bzw. vorherige Platte
let acc=0,lock=0;
stage.addEventListener("wheel",e=>{e.preventDefault();if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;const now=Date.now();acc+=e.deltaY;if(now<lock)return;if(Math.abs(acc)>40){act(acc>0?"next":"prev");acc=0;lock=now+170}},{passive:false});
// Touch: wie die Pfeiltasten (hoch = nächste Platte, runter = zurück, links = Bag, rechts = nächster Track)
let ty=null,tx=null;
// Platte folgt dem Finger (User 27.11.: mehr Flow). Hoch = nächste Platte, runter = zurück,
// Finger nach links = nächster Track, nach rechts = Bag. Unter der Schwelle federt sie zurück.
let drag=null;
// iOS gibt den Ton nur bei einer Berührung frei, nicht nach einem Wisch. Darum beim ersten Berühren den Player stumm
// kurz anspielen (das schaltet ihn frei); wird er trotzdem blockiert, bleibt TAP stehen.
let primed=false;
stage.addEventListener("touchstart",()=>{if(primed||listening||!L[cur])return;primed=true;au.muted=true;au.src=L[cur].tracks[0].u;au.play().then(()=>{if(!listening)au.pause()}).catch(()=>{}).finally(()=>{au.muted=false})},{passive:true});
// Gedrückt halten = vorspulen: der Track läuft dreifach schnell, wie eine zu schnell drehende Platte (User 27.11., 23:36)
let holdT=null,ff=false,ffJust=false;
function ffStart(){holdT=null;if(!L[cur]||busy)return;if(!listening)act("play");ff=true;used.hold=true;
  au.preservesPitch=false;au.webkitPreservesPitch=false;au.playbackRate=3;stage.classList.add("ff");document.getElementById("ghff").classList.add("on");hintKeys()}
function ffStop(){if(!ff)return;ff=false;ffJust=true;setTimeout(()=>{ffJust=false},450);au.playbackRate=1;stage.classList.remove("ff");document.getElementById("ghff").classList.remove("on")}
stage.addEventListener("touchstart",e=>{ty=e.touches[0].clientY;tx=e.touches[0].clientX;drag={ax:null,e:EL.get(cur),t0:performance.now(),lx:tx,ly:ty,lt:performance.now(),vx:0,vy:0};
  clearTimeout(holdT);if(e.target.closest&&e.target.closest(".rec.k0"))holdT=setTimeout(ffStart,380)},{passive:true});
stage.addEventListener("touchmove",e=>{if(ty==null||!drag||!drag.e||busy)return;const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
  if(ff)return;
  {const n=performance.now(),cx=e.touches[0].clientX,cy=e.touches[0].clientY,dt=Math.max(1,n-drag.lt);drag.vx=.6*drag.vx+.4*(cx-drag.lx)/dt;drag.vy=.6*drag.vy+.4*(cy-drag.ly)/dt;drag.lx=cx;drag.ly=cy;drag.lt=n}
  if(!drag.ax){if(Math.hypot(dx,dy)<8)return;clearTimeout(holdT);holdT=null;drag.ax=Math.abs(dy)>Math.abs(dx)?"y":"x";drag.e.style.transition="none"}
  let x=0,y=0,r=0;
  if(drag.ax==="y"){y=dy<0?dy:0;r=0}
  else if(dx<0){x=-110*(1-Math.exp(dx/140));y=0;r=0}/* Skip (User 28.11.): gerade nach links, kein Drehen */
  else{x=dx;y=-Math.min(dx,160)*.12;r=dx*.045}
  drag.e.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`},{passive:true});
stage.addEventListener("contextmenu",e=>e.preventDefault());
stage.addEventListener("touchcancel",()=>{clearTimeout(holdT);holdT=null;ffStop()});
stage.addEventListener("touchend",e=>{clearTimeout(holdT);holdT=null;if(ff){ffStop();ty=null;drag=null;return}if(ty==null)return;const dy=e.changedTouches[0].clientY-ty,dx=e.changedTouches[0].clientX-tx;ty=null;
  const d=drag;drag=null;if(d&&d.e&&d.ax){if(d.ax==="x"&&dx<0){d.e.style.transition="transform .26s cubic-bezier(.2,.7,.2,1)";setTimeout(()=>{d.e.style.transition=""},300)}else{d.e.style.transition="";d.e.classList.add("snap");setTimeout(()=>d.e.classList.remove("snap"),650)}}
  let done=false;
  // Wie bei TikTok/Instagram: ein kurzer, schneller Wisch genügt (Tempo zählt, nicht nur die Strecke)
  const vx=d?d.vx:0,vy=d?d.vy:0,fl=(dist,v,lim,vmin)=>Math.abs(dist)>lim||(Math.abs(dist)>12&&Math.abs(v)>vmin&&Math.sign(v)===Math.sign(dist));
  if(Math.abs(dy)>Math.abs(dx)){if(fl(dy,vy,40,.35)){act(dy<0?"next":"prev");done=true}}
  else if(dx<0){if(fl(dx,vx,24,.3))act("track")}
  else if(fl(dx,vx,50,.4)){act("bag");done=busy}
  if(!done&&d&&d.e&&d.e.isConnected&&EL.get(cur)===d.e)place(d.e,0,cur)},{passive:true});
window.addEventListener("storage",e=>{if(e.key==="mvr-cart"){cart=store.get("mvr-cart",[]);bagCount();paintInfo()}});
bagCount();
fetch("/releases.json",{cache:"no-cache"}).then(r=>r.json()).then(build).catch(()=>{info.innerHTML='<p class="load">Could not load the records. Reload the page.</p>'});
</script>
