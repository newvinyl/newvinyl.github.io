<script>
const CODE={"€":"EUR","£":"GBP","$":"USD","CHF":"CHF","Fr.":"CHF","zł":"PLN"};
const LOC=(()=>{let tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
  if(/Zurich|Vaduz|Busingen/.test(tz))return"CHF";if(/London|Belfast|Guernsey|Jersey|Isle_of_Man|Gibraltar/.test(tz))return"GBP";
  if(/^Europe\/|^Atlantic\/(Canary|Madeira|Azores|Faroe)/.test(tz))return"EUR";if(/^America\//.test(tz))return"USD";
  const r=((navigator.language||"").split("-")[1]||"").toUpperCase();return r==="CH"?"CHF":r==="GB"?"GBP":r==="US"?"USD":"EUR"})();
const SYM={EUR:"€",GBP:"£",USD:"$",CHF:"CHF ",PLN:"zł "};
let FX={};
function toLoc(cur,p){const c=CODE[cur]||cur;if(p==null)return null;if(c===LOC||!FX[c]||!FX[LOC])return{v:+p,c:c===LOC?LOC:c,ex:true};return{v:p*FX[c]/FX[LOC],c:LOC,ex:false}}
const symOf=c=>SYM[c]||(Object.keys(CODE).find(k=>CODE[k]===c)||c);
const money=(cur,p)=>{const L=toLoc(cur,p);if(!L)return"";return`<small>${L.ex?"":"≈"}${esc(symOf(L.c).trim())}</small>${L.v.toFixed(2).replace(/\.00$/,"")}`};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"");
const norm=s=>fold(s).replace(/\(.*?\)|\[.*?\]/g,"").replace(/\b(ep|lp|12"?|2x12"?)\b/g,"").replace(/[^\p{L}\p{N}]/gu,"");
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function track(n,d){try{if(window.umami&&typeof umami.track==="function")umami.track(n,d)}catch(e){}}
function hiRes(u){
  if(!u)return u;
  if(/media\.hardwax\.com\/images\//.test(u)&&!/big\.jpg$/.test(u))return u.replace(/\.jpg$/,"big.jpg");
  if(/redeyerecords\.co\.uk\/imagery\//.test(u))return u.replace(/-2\.jpg$/,"-1.jpg");
  if(/rushhourrecords/.test(u))return u.replace("/styles/cover_medium/","/styles/cover_large/");
  if(/clone\.nl\/platen\/artwork\/small\//.test(u))return u.replace("/artwork/small/","/artwork/large/");
  if(/yoyaku\.io\/wp-content\/uploads\//.test(u))return u.replace(/-\d+x\d+(\.\w+)$/,"$1");
  if(/imagescdn\.juno\.co\.uk\/300\//.test(u))return u.replace("/300/","/full/").replace(/-MED\.jpg$/,"-BIG.jpg");
  if(/decks\.de\/decks\/gfx\/co_mid\//.test(u))return u.replace("/co_mid/","/co_big/");
  return u;
}
const thumb=u=>u?"https://wsrv.nl/?w=720&output=webp&q=80&url="+encodeURIComponent(u):u;
function coverFail(im){const n=+(im.dataset.t||0)+1;im.dataset.t=n;const nx=n===1?im.dataset.o:n===2&&im.dataset.lo!==im.dataset.o?im.dataset.lo:null;if(nx)im.src=nx;else im.remove()}

const stage=document.getElementById("stage"),info=document.getElementById("info"),au=document.getElementById("au");
let ALL=[],CRATES=[],crate=null,L=[],cur=0,ti=0,listening=false,cart=store.get("mvr-cart",[]),EL=new Map(),flips=0,busy=false;
const VIS=18; // sichtbare Platten in der Kiste
const jit=i=>(((i*9301+49297)%233280)/233280-.5)*3.2; // feste kleine Schräglage pro Platte

// Zähler mit Rollziffern
function odo(el,n){const t=String(n),w=Math.max(t.length,1);
  while(el.children.length<w){const d=document.createElement("span");d.className="dg";d.innerHTML="<i>"+"0123456789".split("").map(x=>`<b>${x}</b>`).join("")+"</i>";el.prepend(d)}
  while(el.children.length>w)el.firstElementChild.remove();
  [...el.children].forEach((d,k)=>{d.firstElementChild.style.transform=`translateY(${-(+t[k])}em)`})}
function setCount(a,b){const c=document.getElementById("cnt");if(!L.length){c.hidden=true;return}c.hidden=false;
  if(!c.firstChild)c.innerHTML='<span class="od" id="oda"></span><span class="sl2">/</span><span class="tot od" id="odb"></span>';
  odo(document.getElementById("oda"),a);odo(document.getElementById("odb"),b)}
// Tasten-Hinweise: nach dem ersten Ton blinkt ↑, bis man sie einmal nutzt; bei Platten mit mehreren Tracks blinkt →, bis man sie einmal nutzt
// Haben beide gleichzeitig geblinkt und man drückt eine der beiden, hören beide auf
const TOUCH=matchMedia("(max-width:860px)").matches;
const used=Object.assign({up:false,rt:false,both:false,bag:false},TOUCH?(h=>h.bag?h:{})(store.get("mvr-betahints2",{})):{});
// Grab it!: drei Durchgänge (3 x 1.25s), dann erst wieder nach einer Minute, solange noch nichts im Bag gelandet ist
let bgEnd=0,bgNext=0,hintCur="",hintGap=0;const HINT_GAP=4500;
function hintKeys(){const r=L[cur],up=(listening||TOUCH)&&!used.up,rt=listening&&!used.rt&&!!r&&r.tracks.length>1;
  if(TOUCH){const sh=(id,on)=>{const e=document.getElementById(id);if(e)e.classList.toggle("on",on)};
    const bg=!up&&used.rt&&!used.bag&&!!r&&!(r.out&&!cart.includes(r.key)),tap=!listening,t=Date.now();
    // Nächster Hinweis erst nach einer Pause, damit man den vorherigen verarbeiten kann (User 27.11., 23:18)
    let want=tap?"ghtap":up?"ghup":rt?"ghrt":bg?"ghlt":"";
    if(want!==hintCur){if(hintCur&&want){hintGap=t+HINT_GAP;setTimeout(hintKeys,HINT_GAP+50)}hintCur=want}
    if(t<hintGap)want="";
    if(want==="ghlt"){if(t>=bgNext){bgEnd=t+3750;bgNext=bgEnd+60000;setTimeout(hintKeys,3800);setTimeout(hintKeys,63800)}if(t>=bgEnd)want=""}
    for(const id of["ghtap","ghup","ghrt","ghlt"])sh(id,id===want)}
  if(up&&rt&&!TOUCH)used.both=true;
  document.querySelector(".k-up").classList.toggle("nudge",up);
  document.querySelector(".k-rt").classList.toggle("nudge",rt)}
function bagCount(){document.getElementById("bagn").textContent=cart.length||""}
function build(data){
  FX=data.fx||{};const G={};
  data.shops.forEach(S=>{if(S.blocked)return;(S.items||[]).forEach(r=>{const gk=r.gk||norm(r.a)+"|"+norm(r.t);(G[gk]=G[gk]||[]).push({...r,S,key:S.shop+"|"+r.url,chf:r.p==null?null:r.p*(FX[CODE[S.cur]]||NaN)})})});
  for(const [gk,all] of Object.entries(G)){
    const src=all.find(x=>(x.tr||[]).some(t=>t.u));if(!src)continue;
    const first=all.map(x=>x.first_seen||((x.m||"0000-00")+"-01")).sort()[0];
    const avail=all.filter(x=>x.st!=="out"),out=!avail.length;   // ausverkauft nur, wenn kein Shop sie mehr hat
    const priced=(out?all:avail).filter(x=>x.chf!=null&&!isNaN(x.chf)).sort((a,b)=>a.chf-b.chf),main=priced[0]||src;
    const cover=(all.find(x=>/yoyaku|phonica|cloudfront|kompakt/.test(x.cover||""))||all.find(x=>x.cover)||{}).cover||"";
    ALL.push({gk,first,main,key:main.key,tracks:(src.tr||[]).filter(t=>t.u),cover,out,g:(main.g||src.g||"")});
  }
  ALL.sort((a,b)=>b.first.localeCompare(a.first));
  const days=[...new Set(ALL.map(r=>r.first))].sort().reverse(),today=days[0];
  const week=ALL.filter(r=>days.slice(0,7).includes(r.first));
  CRATES.push({id:"today",name:"Fresh today",recs:ALL.filter(r=>r.first===today)});
  CRATES.push({id:"week",name:"This week",recs:week});
  // Kalendermonate, ausgehend vom neusten Datum in den Daten
  const ym=today.slice(0,7),pm=(([y,m])=>m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,"0")}`)(ym.split("-").map(Number));
  CRATES.push({id:"month",name:"This month",recs:ALL.filter(r=>r.first.slice(0,7)===ym)});
  CRATES.push({id:"lastmonth",name:"Last month",recs:ALL.filter(r=>r.first.slice(0,7)===pm)});
  const gs=r=>String(r.g).split(/\s*[\/,]\s*/).map(g=>g.replace(/\s*·.*$/,"").trim()),cnt={};week.forEach(r=>gs(r).forEach(g=>{if(g)cnt[g]=(cnt[g]||0)+1}));
  Object.entries(cnt).filter(([,n])=>n>=3).sort((a,b)=>b[1]-a[1]).forEach(([g])=>CRATES.push({id:"g:"+g,name:g,recs:week.filter(r=>gs(r).includes(g))}));
  const bar=document.getElementById("bar");
  CRATES.forEach(c=>{const b=document.createElement("button");b.className="crt";b.type="button";b.innerHTML=`${esc(c.name)}<small>${c.recs.length}</small>`;b.onclick=()=>{openCrate(c);track("Beta crate",{crate:c.name})};c.btn=b;bar.appendChild(b)});
  // Mausrad senkrecht scrollt die Leiste seitlich
  bar.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&bar.scrollWidth>bar.clientWidth){e.preventDefault();bar.scrollLeft+=e.deltaY}},{passive:false});
  const want=decodeURIComponent((location.hash.match(/crate=([^&]+)/)||[])[1]||"");
  openCrate(CRATES.find(c=>c.id===want)||CRATES[0]);
}
function openCrate(c){
  crate=c;L=c.recs;cur=0;ti=0;EL.forEach(e=>e.remove());EL.clear();
  CRATES.forEach(x=>x.btn.setAttribute("aria-pressed",x===c));c.btn.scrollIntoView({block:"nearest",inline:"nearest"});
  if(!TOUCH)document.getElementById("binlbl").textContent=c.name;

  render(true);if(listening)playTrack(0);
}
function el(i){
  let e=EL.get(i);if(e)return e;const r=L[i];if(!r)return null;
  e=document.createElement("div");e.className="rec"+(r.out?" sold":"");e.dataset.i=i;
  e.innerHTML=`<div class="sl"><div class="ph">${esc(r.main.a)}<br>${esc(r.main.t)}</div>${r.cover?`<img decoding="async" alt="" src="${esc(thumb(hiRes(r.cover)))}" data-o="${esc(hiRes(r.cover))}" data-lo="${esc(r.cover)}" onerror="coverFail(this)">`:""}</div>`;
  // Klick auf die vordere Platte: nächste Platte; auf eine hintere: direkt zu ihr
  e.onclick=()=>{const k=+e.dataset.i-cur;if(TOUCH&&k===0){act("play");return}if(k>=0)act("next",k?+e.dataset.i:null)};
  stage.insertBefore(e,stage.querySelector(".bin"));EL.set(i,e);return e;
}
function place(e,k,i){
  e.classList.toggle("k0",k===0);e.classList.toggle("gone",k<0);
  if(k<0&&TOUCH){ // Handy: hochgewischt, die Platte fliegt in Wischrichtung nach oben weg
    e.style.transform=`translateY(calc(var(--cv) * -1.35)) scale(.94) rotate(${jit(i)*2}deg)`;e.style.zIndex=160;e.style.filter="none";e.style.opacity=0;return}
  if(k<0){ // umgeblättert: kippt nach vorne und verschwindet hinter der Kistenwand
    e.style.transform=`translateY(calc(var(--cv) * .75)) perspective(900px) rotateX(-28deg) rotate(${jit(i)}deg)`;e.style.zIndex=150;e.style.filter="brightness(.5)";e.style.opacity=0;return}
  e.style.transform=`translateY(calc(var(--cv) * ${-k*.021})) scale(${1-k*.009}) rotate(${k?jit(i):0}deg)`;
  e.style.zIndex=100-k;e.style.filter=`brightness(${1-k*.036})`;e.style.opacity=k>=VIS?0:1;
}
function render(fresh){
  const keep=new Set();for(let i=cur-2;i<=cur+VIS;i++){if(i<0||i>=L.length)continue;keep.add(i);const e=el(i);if(fresh)e.style.transition="none";place(e,i-cur,i);if(fresh){void e.offsetWidth;e.style.transition=""}}
  EL.forEach((e,i)=>{if(!keep.has(i)){e.remove();EL.delete(i)}});
  if(L[cur+VIS+1]&&L[cur+VIS+1].cover){const p=new Image();p.src=thumb(hiRes(L[cur+VIS+1].cover))}
  setCount(Math.min(cur+1,L.length),L.length);hintKeys();
  let end=stage.querySelector(".end");
  if(cur>=L.length){if(!end){end=document.createElement("div");end.className="end";stage.appendChild(end)}end.innerHTML=`That was the last one in here.<br><button type="button">Back to the front</button>`;end.querySelector("button").onclick=()=>go(0)}else if(end)end.remove();
  paintInfo();
}
function paintInfo(){
  const r=L[cur];if(!r){info.innerHTML=`<div class="now"><span>${esc(crate.name)}</span><span>${L.length} records</span></div><div class="ti">You flipped through the whole crate.</div>`;return}
  const m=r.main,t=r.tracks[ti]||r.tracks[0],inb=cart.includes(r.key);
  if(TOUCH&&info.dataset.k!==r.key){info.dataset.k=r.key;try{info.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:380,easing:"cubic-bezier(.2,.8,.2,1)"})}catch(e){}}
  {const k=document.querySelector('.key[data-k="ArrowLeft"]');if(k)k.classList.toggle("off",r.out&&!inb)}
  info.innerHTML=`<div class="now"><span id="nowl">${!au.paused&&listening?"Now playing":"In front"}</span></div>
  <h1 class="ar">${esc(m.a)}${inb?'<span class="inb">In bag</span>':r.out?'<span class="sob" id="sob">Sold out</span>':""}</h1><div class="ti">${esc(m.t)}</div>
  <div class="me">${[m.l,m.cat,m.f,r.g].filter(Boolean).map(esc).join(" · ")}</div>
  <ol class="tl${r.tracks.length>5?" many":""}" id="tl">${r.tracks.map((x,j)=>`<li class="${j===ti&&listening?"on":""}"><button type="button" data-j="${j}"><em>${esc(x.s||j+1)}</em><span>${esc(x.n||"Track "+(j+1))}</span></button><div class="pg"><i></i></div></li>`).join("")}</ol>
  <div class="tlh"${r.tracks.length>5?"":' style="visibility:hidden"'}><span>${r.tracks.length} tracks</span><span id="tlm"></span></div>
  <div class="buyrow"><span class="price">${money(m.S.cur,m.p)}</span><a class="buy" id="buy" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.S.shop)}</a></div>`;
  document.getElementById("buy").onclick=()=>track("Shop click",{shop:m.S.shop,where:"beta"});
  const tl=document.getElementById("tl");
  tl.querySelectorAll("button").forEach(b=>b.onclick=()=>playTrack(+b.dataset.j));
  tl.querySelectorAll(".pg").forEach(g=>g.onclick=e=>{if(!au.duration)return;const b=g.getBoundingClientRect();au.currentTime=au.duration*Math.min(1,Math.max(0,(e.clientX-b.left)/b.width))});
  if(TOUCH){const on=tl.children[ti]||tl.children[0],prev=tl.children[+info.dataset.ti];
    if(info.dataset.k2===r.key&&prev&&prev!==on){tl.scrollTop=prev.offsetTop;requestAnimationFrame(()=>tl.scrollTo({top:on.offsetTop,behavior:"smooth"}))}else tl.scrollTop=on.offsetTop;
    info.dataset.k2=r.key;info.dataset.ti=ti}
  else if(r.tracks.length>5){const on=tl.children[ti];if(on)tl.scrollTop=Math.max(0,on.offsetTop-2*on.offsetHeight);tlEdges();tl.onscroll=tlEdges}
}
// Fenster-Hinweis: welche Ränder ausblenden, wie viele Tracks noch darunter liegen
function tlEdges(){const tl=document.getElementById("tl");if(!tl)return;const atTop=tl.scrollTop<2,atBot=tl.scrollTop+tl.clientHeight>=tl.scrollHeight-2;
  tl.classList.toggle("attop",atTop&&!atBot);tl.classList.toggle("atbot",atBot&&!atTop);
  const m=document.getElementById("tlm");if(m){const below=[...tl.children].filter(li=>li.offsetTop>=tl.scrollTop+tl.clientHeight-4).length;m.textContent=below?`↓ ${below} more`:""}}
let pt=null;
function go(i){
  i=Math.max(0,Math.min(L.length,i));if(i===cur)return;cur=i;ti=0;render();flips++;
  if(flips===5)track("Beta flip",{crate:crate.name,n:5});
  clearTimeout(pt);if(listening)playTrack(0);else warm();   // sofort spielen (User 27.11.: keine Wartezeit beim Blättern)
}
// Vorladen: erste Hörprobe der nächsten zwei Platten, der vorherigen und den nächsten Track der aktuellen.
// Der Browser legt sie in den Cache, beim Weiterblättern startet der Ton dann ohne Ladezeit.
const WARM=new Map();
function warm(){
  const want=[];const add=u=>{if(u&&!want.includes(u))want.push(u)};
  const r=L[cur];if(r&&r.tracks.length>1)add(r.tracks[(ti+1)%r.tracks.length].u);
  [cur+1,cur+2,cur-1].forEach(k=>{const x=L[k];if(x&&x.tracks[0])add(x.tracks[0].u)});
  for(const [u,a] of WARM)if(!want.includes(u)){a.removeAttribute("src");a.load();WARM.delete(u)}
  want.forEach(u=>{if(WARM.has(u)||u===au.src)return;const a=new Audio();a.preload="auto";a.muted=true;a.src=u;try{a.load()}catch(e){}WARM.set(u,a)});
}
function playTrack(j){
  clearTimeout(pt);const r=L[cur];if(!r||!r.tracks[j])return;
  ti=j;listening=true;stage.classList.remove("idle");document.querySelector(".sp").classList.remove("nudge");hintKeys();
  au.muted=false;au.src=r.tracks[j].u;au.play().catch(e=>{if(e&&e.name==="NotAllowedError"){listening=false;hintKeys()}});paintInfo();warm();
}
function nextTrack(){const r=L[cur];if(!r)return;if(!listening){playTrack(0);return}playTrack((ti+1)%r.tracks.length);hop()}
// Trackwechsel sichtbar machen: die Platte hüpft kurz in der Kiste
function hop(){const e=EL.get(cur);if(!e)return;e.classList.remove("hop");void e.offsetWidth;e.classList.add("hop");setTimeout(()=>e.classList.remove("hop"),600)}
function toggle(){if(!listening||!au.src){playTrack(ti);track("Beta play",{crate:crate.name});return}if(au.paused)au.play().catch(()=>{});else au.pause()}
// In den Bag: die Platte fliegt zum Bag-Symbol oben rechts, dann kommt die nächste nach vorne
function pack(){
  const r=L[cur],e=EL.get(cur);if(!r||!e||busy)return;
  // Ausverkauft: nicht in den Bag, Platte schüttelt kurz den Kopf
  if(r.out&&!cart.includes(r.key)){e.classList.remove("nope");void e.offsetWidth;e.classList.add("nope");const so=document.getElementById("sob");if(so){so.classList.add("hit");setTimeout(()=>so.classList.remove("hit"),700)}return}
  busy=true;
  cart=store.get("mvr-cart",[]);if(!cart.includes(r.key)){cart.push(r.key);store.set("mvr-cart",cart);track("Add to bag",{shop:r.main.S.shop,where:"beta"})}
  const t=document.getElementById("bagtop"),a=t.getBoundingClientRect(),b=e.getBoundingClientRect();
  const cur0=getComputedStyle(e).transform;e.classList.remove("snap");e.classList.add("pack");e.style.transform=`translate(${a.left+a.width/2-(b.left+b.width/2)}px,${a.top+a.height/2-(b.top+b.height/2)}px) ${cur0==='none'?'':cur0} rotate(-14deg) scale(.07)`;e.style.opacity=0;
  setTimeout(()=>{bagCount();t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");e.remove();EL.delete(cur);busy=false;go(cur+1)},600)}
// Eine Stelle für alle Eingaben (Tastatur, Klick auf Tasten, Swipe); die erste Eingabe startet auch den Ton
function act(a,arg){
  if(busy)return;
  const first=!listening&&L[cur];
  if(a==="next"||a==="prev")used.up=true;if(a==="track")used.rt=true;if(a==="bag")used.bag=true;if(TOUCH)store.set("mvr-betahints2",{up:used.up,rt:used.rt,bag:used.bag});
  if(used.both&&(a==="next"||a==="prev"||a==="track"))used.up=used.rt=true;
  if(a==="next"){go(arg!=null?arg:cur+1)}
  else if(a==="prev"){go(cur-1)}
  else if(a==="bag"){pack()}
  else if(a==="track"){nextTrack()}
  else if(a==="play"){toggle()}
  if(first&&!listening&&a!=="play"&&a!=="bag"){listening=true;clearTimeout(pt);playTrack(0);track("Beta play",{crate:crate.name,via:a})}
  hintKeys();
}
// Esc: zurück zum klassischen Feed
addEventListener("keydown",e=>{if(e.key==="Escape"&&!e.metaKey&&!e.ctrlKey){location.href="/"}});
const KEYMAP={ArrowUp:"next",ArrowDown:"prev",ArrowLeft:"bag",ArrowRight:"track"," ":"play"};
function flash(k){const b=document.querySelector(`.key[data-k="${k===" "?" ":k}"]`);if(!b)return;b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),140)}
document.querySelectorAll(".key").forEach(b=>b.onclick=()=>{act(KEYMAP[b.dataset.k]);stage.focus({preventScroll:true})});
au.addEventListener("play",()=>{stage.classList.add("playing");const n=document.getElementById("nowl");if(n)n.textContent="Now playing"});
au.addEventListener("pause",()=>{stage.classList.remove("playing");const n=document.getElementById("nowl");if(n)n.textContent="In front"});
au.addEventListener("timeupdate",()=>{const i=document.querySelector(".tl li.on .pg i");if(i&&au.duration)i.style.width=(au.currentTime/au.duration*100)+"%"});
// Ende der Hörprobe: nächster Track, nach dem letzten die nächste Platte (Kiste läuft von selbst weiter)
au.addEventListener("ended",()=>{const r=L[cur];if(r&&ti+1<r.tracks.length)playTrack(ti+1);else go(cur+1)});

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/input|textarea/i.test(e.target.tagName))return;
  const k=e.key;
  if(KEYMAP[k]){if(k===" "&&(e.target.tagName==="A"||(e.target.tagName==="BUTTON"&&!e.target.classList.contains("key"))))return;flash(k);act(KEYMAP[k])}
  else if(k==="Enter"&&(e.target===stage||e.target===document.body)||k==="o"){const r=L[cur];if(r){track("Shop click",{shop:r.main.S.shop,where:"beta"});window.open(r.main.url,"_blank","noopener")}}
  else if(k==="b"||k==="B"){flash("ArrowLeft");act("bag")}
  else return;
  e.preventDefault();
});
// Mausrad / Trackpad senkrecht: nächste bzw. vorherige Platte
let acc=0,lock=0;
stage.addEventListener("wheel",e=>{e.preventDefault();if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;const now=Date.now();acc+=e.deltaY;if(now<lock)return;if(Math.abs(acc)>40){act(acc>0?"next":"prev");acc=0;lock=now+170}},{passive:false});
// Touch: wie die Pfeiltasten (hoch = nächste Platte, runter = zurück, links = Bag, rechts = nächster Track)
let ty=null,tx=null;
// Platte folgt dem Finger (User 27.11.: mehr Flow). Hoch = nächste Platte, runter = zurück,
// Finger nach links = nächster Track, nach rechts = Bag. Unter der Schwelle federt sie zurück.
let drag=null;
// iOS gibt den Ton nur bei einer Berührung frei, nicht nach einem Wisch. Darum beim ersten Berühren den Player stumm
// kurz anspielen (das schaltet ihn frei); wird er trotzdem blockiert, bleibt TAP stehen.
let primed=false;
stage.addEventListener("touchstart",()=>{if(primed||listening||!L[cur])return;primed=true;au.muted=true;au.src=L[cur].tracks[0].u;au.play().then(()=>{if(!listening)au.pause()}).catch(()=>{}).finally(()=>{au.muted=false})},{passive:true});
stage.addEventListener("touchstart",e=>{ty=e.touches[0].clientY;tx=e.touches[0].clientX;drag={ax:null,e:EL.get(cur)}},{passive:true});
stage.addEventListener("touchmove",e=>{if(ty==null||!drag||!drag.e||busy)return;const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
  if(!drag.ax){if(Math.hypot(dx,dy)<8)return;drag.ax=Math.abs(dy)>Math.abs(dx)?"y":"x";drag.e.style.transition="none"}
  let x=0,y=0,r=0;
  if(drag.ax==="y"){y=dy<0?dy:0;r=0}
  else{x=dx<0?dx*.35:dx;y=dx>0?-Math.min(dx,160)*.12:0;r=dx*.045}
  drag.e.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`},{passive:true});
stage.addEventListener("touchend",e=>{if(ty==null)return;const dy=e.changedTouches[0].clientY-ty,dx=e.changedTouches[0].clientX-tx;ty=null;
  const d=drag;drag=null;if(d&&d.e&&d.ax){d.e.style.transition="";d.e.classList.add("snap");setTimeout(()=>d.e.classList.remove("snap"),650)}
  let done=false;
  if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx)){act(dy<0?"next":"prev");done=true}
  else if(Math.abs(dx)>50){act(dx<0?"track":"bag");done=dx>0&&busy}
  if(!done&&d&&d.e&&d.e.isConnected&&EL.get(cur)===d.e)place(d.e,0,cur)},{passive:true});
window.addEventListener("storage",e=>{if(e.key==="mvr-cart"){cart=store.get("mvr-cart",[]);bagCount();paintInfo()}});
bagCount();
fetch("/releases.json",{cache:"no-cache"}).then(r=>r.json()).then(build).catch(()=>{info.innerHTML='<p class="load">Could not load the records. Reload the page.</p>'});
</script>
