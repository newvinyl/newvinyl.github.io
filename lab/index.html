<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Monthly Vinyl Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: nur Cover-Raster. Handy 1 Spalte, Tablet 2, Desktop 3–4. Rückseite per «More». */
:root{
  --bg:#0d0d0d; --deep:#1a1a1a; --fg:#ecebe7; --muted:#a0a4a9; --line:#3c4046;
  --neon:#39ff14; --pink:#ff2bd6; --yellow:#fbed4f; --white:#ffffff; --ink:#0d0d0d;
  --display:"Helvetica Neue","HelveticaNeue",Helvetica,Arial,sans-serif;
  --body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
button{font:inherit;color:inherit}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg);border-bottom:2px solid var(--white)}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.01em;text-decoration:none;color:var(--yellow);text-transform:uppercase}
.bagtop{all:unset;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:2px solid var(--white);background:var(--ink)}
.bagtop svg{width:22px;height:22px}
.bagtop b{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--pink);color:var(--ink);font:700 12px/20px var(--mono);text-align:center}
.bagtop b:empty{display:none}
.bagtop.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.18)}}

.day{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day b{font-family:var(--display);font-size:22px;letter-spacing:0;text-transform:none;color:var(--neon)}

.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1400px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.card{position:relative;aspect-ratio:1/1;max-width:100%;perspective:1400px}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.card.back .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:var(--deep)}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ph span{width:62%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font:500 13px/1.3 var(--mono);color:var(--ink)}
.card.playing .front{outline:4px solid var(--neon);outline-offset:-4px}

.play{all:unset;cursor:pointer;position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;
  background:var(--white);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.45);transition:transform .15s}
.play:active{transform:scale(.92)}
.play svg{width:30px;height:30px}
.play .ps{display:none}
.card.playing .play{background:var(--neon)}
.card.playing .play .pl{display:none}
.card.playing .play .ps{display:block}
.play:focus-visible,.more:focus-visible,.add:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

.add{all:unset;cursor:pointer;position:absolute;left:12px;bottom:12px;height:40px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;
  background:var(--ink);color:var(--white);border:2px solid var(--white);font:700 14px/1 var(--display)}
.add svg{width:15px;height:15px}
.add.in{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.more{all:unset;cursor:pointer;position:absolute;right:12px;bottom:12px;height:40px;padding:0 13px;display:inline-flex;align-items:center;
  background:var(--ink);color:var(--white);border:2px solid var(--white);font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--neon)}

.backf{transform:rotateY(180deg);background:var(--ink);border:2px solid var(--white);padding:16px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.backf .ar{font:800 23px/1.08 var(--display);text-wrap:balance}
.backf .ti{font:400 17px/1.25 var(--body)}
.backf .me{font:400 12px/1.6 var(--mono);color:var(--muted)}
.backf ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:auto}
.backf li button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:32px;width:100%;font-size:14px}
.backf li .s{font:400 11px var(--mono);color:var(--muted);width:24px;flex:none}
.backf li.on button{color:var(--neon)}
.backf .pr{flex:none;padding-top:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.backf .price{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.backf .price small{font-size:.5em;vertical-align:.6em;margin-right:2px}
.backf .shop{font:400 12px/1.4 var(--mono);color:var(--muted);text-align:right}
.backf .ctl{flex:none;display:flex;justify-content:space-between;gap:10px;padding-top:12px}
.backf .ctl .add,.backf .ctl .more{position:static}
.backf .buy{color:var(--yellow);font-weight:700;font-size:14px;text-underline-offset:3px}

.mini{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--deep);border-top:2px solid var(--white)}
.mini.on{display:flex}
.mini .mt{flex:1;min-width:0}
.mini .mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{display:block;font:400 11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .madd{all:unset;cursor:pointer;white-space:nowrap;flex:none;height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;background:var(--pink);color:var(--ink);font:800 15px/1 var(--display)}
.mini .madd svg{width:15px;height:15px}
.mini .madd.in{background:var(--ink);color:var(--pink);box-shadow:inset 0 0 0 2px var(--pink)}
.mini .mnx{all:unset;cursor:pointer;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--white);border-radius:50%}
.mini .mnx svg{width:18px;height:18px}

.note{max-width:62ch;margin:30px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.load{padding:40px 0;font-family:var(--mono);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.flip{transition:none}.bagtop.pop{animation:none}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="/">Monthly Vinyl</a>
  <a class="bagtop" id="bagtop" href="/#korb" aria-label="My bag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9h18v11H3z"/><path d="M7 9V5h10v4"/><path d="M7 5h2M11 5h2M15 5h2" stroke-width="1.6"/></svg><b id="bagn"></b></a>
</header>
<main id="feed"><p class="load">Loading today's records…</p></main>
<p class="note">Lab preview: cover and play button only. «More» turns the cover over. Records without a playable preview are left out here. Your bag is the same as on the main page.</p>
<div class="mini" id="mini" role="region" aria-label="Now playing">
  <div class="mt"><b id="mtt"></b><span id="mta"></span></div>
  <button class="madd" id="madd" type="button"></button>
  <button class="mnx" id="mnx" type="button" aria-label="Next record"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2l8 6-8 6zM11 2h3v12h-3z"/></svg></button>
</div>
<audio id="au" preload="none"></audio>
<script>
const PLAY='<svg class="pl" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="ps" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
const PLUS='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 2v12M2 8h12"/></svg>';
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2.5 8.5 6.5 12 13.5 4"/></svg>';
const HUES=["#d6a3d8","#b9d8a3","#e8c34a","#83b59d","#f0c98f","#f0a060","#a3c4e8","#e07a62"];
const CODE={"€":"EUR","£":"GBP","$":"USD","CHF":"CHF","Fr.":"CHF"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"");
const norm=s=>fold(s).replace(/\(.*?\)|\[.*?\]/g,"").replace(/\b(ep|lp|12"?|2x12"?)\b/g,"").replace(/[^\p{L}\p{N}]/gu,"");
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function hiRes(u){
  if(!u)return u;
  if(/media\.hardwax\.com\/images\//.test(u)&&!/big\.jpg$/.test(u))return u.replace(/\.jpg$/,"big.jpg");
  if(/redeyerecords\.co\.uk\/imagery\//.test(u))return u.replace(/-2\.jpg$/,"-1.jpg");
  if(/rushhourrecords/.test(u))return u.replace("/styles/cover_medium/","/styles/cover_large/");
  if(/clone\.nl\/platen\/artwork\/small\//.test(u))return u.replace("/artwork/small/","/artwork/large/");
  if(/yoyaku\.io\/wp-content\/uploads\//.test(u))return u.replace(/-\d+x\d+(\.\w+)$/,"$1");
  if(/imagescdn\.juno\.co\.uk\/300\//.test(u))return u.replace("/300/","/full/").replace(/-MED\.jpg$/,"-BIG.jpg");
  if(/decks\.de\/decks\/gfx\/co_mid\//.test(u))return u.replace("/co_mid/","/co_big/");
  return u;
}
const fmtDay=d=>{const t=new Date(d+"T12:00:00");return t.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})};
const money=(cur,p)=>p==null?"":`<small>${esc(cur)}</small>${Number(p).toFixed(2).replace(/\.00$/,"")}`;

let cart=store.get("mvr-cart",[]),RECS=[],cur=-1,trackIdx=0;
const au=document.getElementById("au");
function bagCount(){const b=document.getElementById("bagn");b.textContent=cart.length||""}
function inBag(rec){return cart.includes(rec.key)}
function toggleBag(rec){
  cart=store.get("mvr-cart",[]);
  if(cart.includes(rec.key))cart=cart.filter(k=>k!==rec.key);else{cart.push(rec.key);const t=document.getElementById("bagtop");t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop")}
  store.set("mvr-cart",cart);bagCount();paintBag();
}
function paintBag(){
  document.querySelectorAll(".card").forEach(c=>{const r=RECS[c.dataset.i],on=inBag(r);c.querySelectorAll(".add").forEach(b=>{b.classList.toggle("in",on);b.innerHTML=on?`${CHECK}In bag`:`${PLUS}Bag`})});
  const m=document.getElementById("madd");if(cur>=0){const on=inBag(RECS[cur]);m.classList.toggle("in",on);m.innerHTML=on?`${CHECK}In bag`:`${PLUS}Bag`}
}

function build(data){
  const fx=data.fx||{},G={};
  data.shops.forEach(S=>(S.items||[]).forEach(r=>{const gk=norm(r.a)+"|"+norm(r.t);(G[gk]=G[gk]||[]).push({...r,S,key:S.shop+"|"+r.url,chf:r.p==null?null:r.p*(fx[CODE[S.cur]]||NaN)})}));
  const recs=[];
  for(const [gk,all] of Object.entries(G)){
    const first=all.map(x=>x.first_seen||((x.m||"0000-00")+"-01")).sort()[0];
    const src=all.find(x=>(x.tr||[]).some(t=>t.u));if(!src)continue;
    const priced=all.filter(x=>x.chf!=null&&!isNaN(x.chf)).sort((a,b)=>a.chf-b.chf);
    const main=priced[0]||src;
    const cover=(all.find(x=>/yoyaku|phonica|cloudfront|kompakt/.test(x.cover||""))||all.find(x=>x.cover)||{}).cover||"";
    recs.push({gk,first,all,main,key:main.key,src,tracks:(src.tr||[]).filter(t=>t.u),cover,shops:new Set(all.map(x=>x.S.shop)).size});
  }
  const days=[...new Set(recs.map(r=>r.first))].sort().reverse().slice(0,5);
  RECS=[];const feed=document.getElementById("feed");feed.innerHTML="";
  days.forEach((d,di)=>{
    const list=recs.filter(r=>r.first===d).sort((a,b)=>b.shops-a.shops||b.tracks.length-a.tracks.length);
    if(!list.length)return;
    const h=document.createElement("div");h.className="day";h.innerHTML=`<b>${di===0?"Fresh today":fmtDay(d)}</b><span>${list.length} records</span>`;feed.appendChild(h);
    const g=document.createElement("div");g.className="grid";feed.appendChild(g);
    list.forEach(r=>{const i=RECS.push(r)-1;g.appendChild(card(r,i))});
  });
  paintBag();bagCount();
}
function card(r,i){
  const m=r.main,el=document.createElement("article");el.className="card";el.dataset.i=i;
  const hue=HUES[(m.a||"").length%HUES.length];
  const others=r.all.filter(x=>x!==m&&x.p!=null);
  el.innerHTML=`<div class="flip">
    <div class="face front"><div class="ph"><span style="background:${hue}">${esc(m.l)}${m.cat?"<br>"+esc(m.cat):""}</span></div>
      ${r.cover?`<img loading="lazy" decoding="async" alt="${esc(m.a)} – ${esc(m.t)}" src="${esc(hiRes(r.cover))}" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='${esc(r.cover)}'}else this.remove()">`:""}
      <button class="play" type="button" aria-label="Play ${esc(m.a)} – ${esc(m.t)}">${PLAY}</button>
      <button class="add" type="button"></button>
      <button class="more" type="button" aria-label="Show details">More</button>
      <div class="bar"></div></div>
    <div class="face backf" aria-hidden="true">
      <div class="ar">${esc(m.a)}</div><div class="ti">${esc(m.t)}</div>
      <div class="me">${esc(m.l)}${m.cat?" · "+esc(m.cat):""}${m.f?" · "+esc(m.f):""}${m.g?"<br>"+esc(m.g):""}</div>
      <ol>${r.tracks.slice(0,6).map((t,ti)=>`<li data-t="${ti}"><button type="button"><span class="s">${esc(t.s||"")}</span><span>${esc(t.n||"Preview")}</span></button></li>`).join("")}</ol>
      <div class="pr"><div class="price">${money(m.S.cur,m.p)}</div>
        <div class="shop">${esc(m.S.shop)}${others.length?` · +${others.length} more ${others.length>1?"shops":"shop"}`:""}<br><a class="buy" href="${esc(m.url)}" target="_blank" rel="noopener">Buy at ${esc(m.S.shop)} ↗</a></div></div>
    </div></div>`;
  const back=el.querySelector(".backf"),mb=el.querySelector(".more");
  mb.onclick=()=>{el.classList.add("back");back.setAttribute("aria-hidden","false")};
  back.onclick=e=>{if(e.target.closest("button,a"))return;el.classList.remove("back");back.setAttribute("aria-hidden","true")};
  el.querySelector(".play").onclick=()=>{if(cur===i&&!au.paused){au.pause()}else if(cur===i&&au.src){au.play()}else play(i,0)};
  el.querySelector(".add").onclick=()=>toggleBag(r);
  el.querySelectorAll(".backf li").forEach(li=>li.querySelector("button").onclick=()=>play(i,+li.dataset.t));
  // Rückseite hat eigene Knöpfe: Bag und zurück
  const ctl=document.createElement("div");ctl.className="ctl";
  ctl.innerHTML=`<button class="add" type="button"></button><button class="more" type="button">Cover</button>`;
  back.appendChild(ctl);
  ctl.querySelector(".add").onclick=()=>toggleBag(r);
  ctl.querySelector(".more").onclick=()=>{el.classList.remove("back");back.setAttribute("aria-hidden","true")};
  return el;
}
function play(i,t){
  const r=RECS[i];if(!r)return;
  cur=i;trackIdx=t;au.src=r.tracks[t].u;au.play().catch(()=>{});
  document.querySelectorAll(".card").forEach(c=>{c.classList.toggle("playing",+c.dataset.i===i);c.querySelectorAll(".backf li").forEach(li=>li.classList.toggle("on",+c.dataset.i===i&&+li.dataset.t===t))});
  document.querySelectorAll(".bar").forEach(b=>b.style.width="0");
  document.getElementById("mtt").textContent=`${r.main.a} – ${r.main.t}`;
  document.getElementById("mta").textContent=`${r.tracks[t].s?r.tracks[t].s+" · ":""}${r.tracks[t].n||"Preview"} · ${r.main.S.shop}`;
  document.getElementById("mini").classList.add("on");paintBag();
}
function next(){
  const r=RECS[cur];if(!r)return;
  if(trackIdx+1<r.tracks.length)return play(cur,trackIdx+1);
  if(cur+1<RECS.length){play(cur+1,0);const c=document.querySelector(`.card[data-i="${cur}"]`);if(c)c.scrollIntoView({behavior:"smooth",block:"center"})}
}
au.addEventListener("ended",next);
au.addEventListener("pause",()=>{if(cur>=0)document.querySelector(`.card[data-i="${cur}"]`)?.classList.remove("playing")});
au.addEventListener("play",()=>{if(cur>=0)document.querySelector(`.card[data-i="${cur}"]`)?.classList.add("playing")});
au.addEventListener("timeupdate",()=>{const c=document.querySelector(`.card[data-i="${cur}"] .bar`);if(c&&au.duration)c.style.width=(100*au.currentTime/au.duration)+"%"});
document.getElementById("mnx").onclick=()=>{const r=RECS[cur];if(r&&cur+1<RECS.length){play(cur+1,0);document.querySelector(`.card[data-i="${cur}"]`)?.scrollIntoView({behavior:"smooth",block:"center"})}};
document.getElementById("madd").onclick=()=>{if(cur>=0)toggleBag(RECS[cur])};
window.addEventListener("storage",e=>{if(e.key==="mvr-cart"){cart=store.get("mvr-cart",[]);bagCount();paintBag()}});
fetch("/releases.json",{cache:"no-cache"}).then(r=>r.json()).then(build).catch(()=>{document.getElementById("feed").innerHTML='<p class="load">Could not load the records. Reload the page.</p>'});
</script>
</body>
</html>
